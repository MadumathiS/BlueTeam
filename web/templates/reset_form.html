<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriftLock - New Password</title>
    <link rel="stylesheet" href="/static/css/home.css">
</head>
<body>

<img src="/static/images/DriftLockALPHA.png" alt="DriftLock Alpha" class="site-logo-top-left">

<nav class="top-auth-nav" aria-label="Authentication links">
    <a href="/" class="top-auth-link">HOME</a>
    <span class="top-auth-separator">/</span>
    <a href="/login" class="top-auth-link">LOGIN</a>
</nav>

<section class="vault-home">
    <div class="p-6 bg-market-gray border border-market-gold rounded-lg shadow-xl mb-8" style="max-width: 540px; margin-left: auto; margin-right: auto;">
        <h1 class="text-xl text-white font-bold mb-3 border-b border-market-border pb-2">Set New Password</h1>

        <form id="reset-form">
            <label for="password" class="text-sm text-market-gold font-semibold block mb-1">New Password</label>
            <input id="password" name="password" type="password" required minlength="8"
                   style="width: 100%; padding: 0.6rem; border-radius: 0.5rem; border: 1px solid var(--market-border); background: #11141a; color: #fff;"
                   class="mb-3">

            <label for="confirm_password" class="text-sm text-market-gold font-semibold block mb-1">Confirm Password</label>
            <input id="confirm_password" name="confirm_password" type="password" required minlength="8"
                   style="width: 100%; padding: 0.6rem; border-radius: 0.5rem; border: 1px solid var(--market-border); background: #11141a; color: #fff;"
                   class="mb-3">

            <button type="submit" class="top-auth-link"
                    style="background: var(--market-gold); color: #1a1d24; border: 0; border-radius: 0.5rem; padding: 0.6rem 0.9rem; font-weight: 700; cursor: pointer;">
                Reset Password
            </button>
        </form>

        <p id="form-message" class="text-sm mt-3"></p>
    </div>
</section>

<script>
const token = window.location.pathname.split('/reset-password/')[1];

document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('form-message');
    const password = document.getElementById('password').value;
    const confirm_password = document.getElementById('confirm_password').value;

    if (password.length < 8) {
        msg.className = 'text-red-400 text-sm mt-3';
        msg.textContent = 'Password must be at least 8 characters.';
        return;
    }
    if (password !== confirm_password) {
        msg.className = 'text-red-400 text-sm mt-3';
        msg.textContent = 'Passwords do not match.';
        return;
    }

    try {
        const res = await fetch('/api/reset-password/' + token, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password, confirm_password })
        });
        const data = await res.json();

        if (!res.ok) {
            msg.className = 'text-red-400 text-sm mt-3';
            msg.textContent = data.error || 'Reset failed.';
            return;
        }

        msg.className = 'text-market-gold text-sm mt-3';
        msg.textContent = data.message || 'Password reset. Redirecting to login...';
        setTimeout(() => { window.location.href = '/login'; }, 2000);
    } catch (err) {
        msg.className = 'text-red-400 text-sm mt-3';
        msg.textContent = 'Network error, please try again.';
    }
});
</script>

</body>
</html>
