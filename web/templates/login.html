<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriftLock - Login</title>
    <link rel="stylesheet" href="/static/css/home.css">
</head>
<body>

<img src="/static/images/DriftLockALPHA.png" alt="DriftLock Alpha" class="site-logo-top-left">

<nav class="top-auth-nav" aria-label="Authentication links">
    <a href="index.html" class="top-auth-link">HOME</a>
    <span class="top-auth-separator">/</span>
    <a href="register.html" class="top-auth-link">REGISTER</a>
</nav>

<section class="vault-home">
    <div class="p-6 bg-market-gray border border-market-gold rounded-lg shadow-xl mb-8" style="max-width: 540px; margin-left: auto; margin-right: auto;">
        <h1 class="text-xl text-white font-bold mb-3 border-b border-market-border pb-2">Connexion</h1>

        <form id="login-form">
            <label for="username" class="text-sm text-market-gold font-semibold block mb-1">Account Name or Email</label>
            <input id="username" name="username" type="text" required minlength="3" maxlength="20" class="mb-3" style="width: 100%; padding: 0.6rem; border-radius: 0.5rem; border: 1px solid var(--market-border); background: #11141a; color: #fff;">

            <label for="password" class="text-sm text-market-gold font-semibold block mb-1">Password</label>
            <input id="password" name="password" type="password" required minlength="8" class="mb-3" style="width: 100%; padding: 0.6rem;border-radius: 0.5rem; border: 1px solid var(--market-border); background: #11141a; color: #fff;">

            <button type="submit" class="top-auth-link" style="background: var(--market-gold); color: #1a1d24; border: 0; border-radius: 0.5rem; padding: 0.6rem 0.9rem; font-weight: 700; cursor: pointer;">Login</button>
        </form>

        <p id="form-message" class="text-sm mt-3"></p>
        <div id="reset-link-box" style="display:none; margin-top: 0.75rem;">
            <a href="/reset-password" class="text-sm" style="color: var(--market-gold); text-decoration: underline;">
                Click here to reset your password
            </a>
        </div>
    </div>
</section>

<script>
const loginForm = document.getElementById('login-form');
const formMessage = document.getElementById('form-message');
const resetLinkBox = document.getElementById('reset-link-box');

loginForm.addEventListener('submit', async (event) => {
    event.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
        formMessage.className = 'text-red-400 text-sm mt-3';
        formMessage.textContent = 'Veuillez remplir tous les champs.';
        return;
    }

    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();
        if (!response.ok) {
            formMessage.className = 'text-red-400 text-sm mt-3';

            if (data.locked) {
                formMessage.textContent = '3 failed login attempts on your account. If this wasn\'t you, reset your password.';
                resetLinkBox.style.display = 'block';
                loginForm.querySelector('button').disabled = true;
                loginForm.querySelector('button').style.opacity = '0.4';
            } else if (data.attempts_remaining !== undefined) {
                const r = data.attempts_remaining;
                formMessage.textContent = 'Invalid credentials. ' + r + ' more attempt' + (r !== 1 ? 's' : '') + ' remaining.';
                resetLinkBox.style.display = 'none';
            } else {
                formMessage.textContent = data.error || 'Connexion impossible.';
                resetLinkBox.style.display = 'none';
            }
            return;
        }

        resetLinkBox.style.display = 'none';
        loginForm.querySelector('button').disabled = false;
        loginForm.querySelector('button').style.opacity = '1';

        if (data.mfa_required) {
            window.location.href = '/verify-mfa';
            return;
        }
        formMessage.className = 'text-market-gold text-sm mt-3';
        formMessage.textContent = 'Connexion reussie.';
        loginForm.reset();
        window.location.href = '/';
    } catch (error) {
        formMessage.className = 'text-red-400 text-sm mt-3';
        formMessage.textContent = 'Erreur reseau, veuillez reessayer.';
    }
});
</script>

</body>
</html>
