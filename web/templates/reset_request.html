<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriftLock - Reset Password</title>
    <link rel="stylesheet" href="/static/css/home.css">
</head>
<body>

<img src="/static/images/DriftLockALPHA.png" alt="DriftLock Alpha" class="site-logo-top-left">

<nav class="top-auth-nav" aria-label="Authentication links">
    <a href="/" class="top-auth-link">HOME</a>
    <span class="top-auth-separator">/</span>
    <a href="/login" class="top-auth-link">LOGIN</a>
</nav>

<section class="vault-home">
    <div class="p-6 bg-market-gray border border-market-gold rounded-lg shadow-xl mb-8" style="max-width: 540px; margin-left: auto; margin-right: auto;">
        <h1 class="text-xl text-white font-bold mb-3 border-b border-market-border pb-2">Reset Password</h1>
        <p class="text-sm text-white mb-3" style="opacity: 0.7;">Enter the email address linked to your account.</p>

        <form id="reset-request-form">
            <label for="email" class="text-sm text-market-gold font-semibold block mb-1">Email Address</label>
            <input id="email" name="email" type="email" required
                   style="width: 100%; padding: 0.6rem; border-radius: 0.5rem; border: 1px solid var(--market-border); background: #11141a; color: #fff;"
                   class="mb-3">

            <button type="submit" class="top-auth-link"
                    style="background: var(--market-gold); color: #1a1d24; border: 0; border-radius: 0.5rem; padding: 0.6rem 0.9rem; font-weight: 700; cursor: pointer;">
                Send Reset Link
            </button>
        </form>

        <p id="form-message" class="text-sm mt-3"></p>
    </div>
</section>

<script>
document.getElementById('reset-request-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('form-message');
    const email = document.getElementById('email').value.trim();

    if (!email) {
        msg.className = 'text-red-400 text-sm mt-3';
        msg.textContent = 'Please enter your email address.';
        return;
    }

    try {
        const res = await fetch('/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const data = await res.json();
        msg.className = 'text-market-gold text-sm mt-3';
        msg.textContent = data.message || 'If an account with that email exists, a reset link has been generated.';
    } catch (err) {
        msg.className = 'text-red-400 text-sm mt-3';
        msg.textContent = 'Network error, please try again.';
    }
});
</script>

</body>
</html>
