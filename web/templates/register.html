<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriftLock - Register</title>
    <link rel="stylesheet" href="/static/css/home.css">
</head>
<body>

<img src="/static/images/DriftLockALPHA.png" alt="DriftLock Alpha" class="site-logo-top-left">

<nav class="top-auth-nav" aria-label="Authentication links">
    <a href="index.html" class="top-auth-link">HOME</a>
    <span class="top-auth-separator">/</span>
    <a href="login.html" class="top-auth-link">LOGIN</a>
</nav>

<section class="vault-home">
    <div class="p-6 bg-market-gray border border-market-gold rounded-lg shadow-xl mb-8" style="max-width: 540px; margin-left: auto; margin-right: auto;">
        <h1 class="text-xl text-white font-bold mb-3 border-b border-market-border pb-2">Create your account</h1>

        <form id="register-form">
            <label for="username" class="text-sm text-market-gold font-semibold block mb-1">Account Name</label>
            <input id="username" name="username" type="text" required minlength="3" maxlength="20" class="mb-3" style="width: 100%; padding: 0.6rem; border-radius: 0.5rem; border: 1px solid var(--market-border); background: #11141a; color: #fff;">

            <label for="email" class="text-sm text-market-gold font-semibold block mb-1">Email</label>
            <input id="email" name="email" type="email" required class="mb-3" style="width: 100%; padding: 0.6rem; border-radius: 0.5rem; border: 1px solid var(--market-border); background: #11141a; color: #fff;">

            <label for="password" class="text-sm text-market-gold font-semibold block mb-1">Password</label>
            <input id="password" name="password" type="password" required minlength="8" class="mb-3" style="width: 100%; padding: 0.6rem; border-radius: 0.5rem; border: 1px solid var(--market-border); background: #11141a; color: #fff;">

            <label for="confirm_password" class="text-sm text-market-gold font-semibold block mb-1">Confirm Password</label>
            <input id="confirm_password" name="confirm_password" type="password" required minlength="8" class="mb-3" style="width: 100%; padding: 0.6rem; border-radius: 0.5rem; border: 1px solid var(--market-border); background: #11141a; color: #fff;">

            <button type="submit" class="top-auth-link" style="background: var(--market-gold); color: #1a1d24; border: 0; border-radius: 0.5rem; padding: 0.6rem 0.9rem; font-weight: 700; cursor: pointer;">Create Account</button>
        </form>

        <p id="form-message" class="text-sm mt-3"></p>
    </div>
</section>

<script>
const registerForm = document.getElementById('register-form');
const formMessage = document.getElementById('form-message');

registerForm.addEventListener('submit', async (event) => {
    event.preventDefault();

    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;

    if (password !== confirmPassword) {
        formMessage.className = 'text-red-400 text-sm mt-3';
        formMessage.textContent = 'Les mots de passe ne correspondent pas.';
        return;
    }

    try {
        const response = await fetch("{{ url_for('register') }}", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password, confirm_password: confirmPassword })
        });

        const data = await response.json();
        if (!response.ok) {
            formMessage.className = 'text-red-400 text-sm mt-3';
            formMessage.textContent = data.error || 'Registration failed.';
            return;
        }

        formMessage.className = 'text-market-gold text-sm mt-3';
        formMessage.textContent = 'Compte cree avec succes.';
        registerForm.reset();
    } catch (error) {
        formMessage.className = 'text-red-400 text-sm mt-3';
        formMessage.textContent = 'Erreur reseau, veuillez reessayer.';
    }
});
</script>

</body>
</html>
