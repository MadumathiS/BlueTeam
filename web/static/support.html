<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriftLock - Support</title>
    <link rel="stylesheet" href="/static/css/home.css">
    <style>
        .support-card{max-width:700px;margin:0 auto}.input-field{width:100%;box-sizing:border-box;padding:.7rem;margin:.35rem 0 1rem;border-radius:.5rem;border:1px solid var(--market-border);background:#11141a;color:#fff;font-family:inherit}.input-field:focus{outline:none;border-color:var(--market-gold)}textarea{min-height:150px;resize:vertical}.btn-submit{background:var(--market-gold);color:#1a1d24;border:0;border-radius:.5rem;padding:.65rem 1rem;font-weight:700;cursor:pointer}.success-banner{display:none;margin-top:1rem;padding:.75rem;border:1px solid #16a34a;border-radius:.5rem;background:#14532d;color:#4ade80}.user-chip{float:right;color:var(--market-gold)}
    </style>
</head>
<body>
<img src="/static/images/DriftLockALPHA.png" alt="DriftLock Alpha" class="site-logo-top-left">
<nav class="top-auth-nav" aria-label="Navigation">
    <a href="/" class="top-auth-link">HOME</a>
    <span class="top-auth-separator">/</span>
    <a href="/static/login.html" class="top-auth-link">LOGOUT</a>
</nav>
<section class="vault-home">
    <div class="support-card p-6 bg-market-gray border border-market-gold rounded-lg shadow-xl">
        <span class="user-chip">● utilisateur</span>
        <h1 class="text-xl text-white font-bold mb-3 border-b border-market-border pb-2">Support</h1>
        <p class="text-gray-400 mb-3">Envoie un message à l'équipe DriftLock.</p>
        <form id="support-form">
            <label for="subject" class="text-sm text-market-gold font-semibold block">Sujet</label>
            <select id="subject" class="input-field" required>
                <option value="" disabled selected>-- Sélectionner une catégorie --</option>
                <option>Problème de compte</option><option>Authentification MFA</option><option>Signalement de sécurité</option><option>Autre</option>
            </select>
            <label for="message" class="text-sm text-market-gold font-semibold block">Message</label>
            <textarea id="message" class="input-field" required minlength="20" placeholder="Décris ton problème en détail…"></textarea>
            <button type="submit" class="btn-submit">Envoyer le message</button>
        </form>
        <div id="success-banner" class="success-banner">✓ Message envoyé visuellement. L'équipe admin te répondra sous 24h.</div>
    </div>
</section>
<script>
document.getElementById('support-form').addEventListener('submit', (event) => { event.preventDefault(); document.getElementById('success-banner').style.display='block'; event.target.reset(); });
</script>
</body>
</html>
