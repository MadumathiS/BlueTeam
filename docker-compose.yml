services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: driftlock_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: driftlock
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftlock_admin -d driftlock"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./web
    ports:
      - "4325:4325"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      POSTGRES_USER: driftlock_admin
      POSTGRES_DB: driftlock
      DB_HOST: db
      DB_PORT: 5432
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      MASTER_KEY: ${MASTER_KEY}
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./logs:/app/logs

  redis:
    image: redis:7
    container_name: driftlock-redis-1
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: