services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: driftlock_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: driftlock
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftlock_admin -d driftlock"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    security_opt:
      - no-new-privileges:true


  web:
    build: ./web
    ports:
      - "0.0.0.0:4325:4325"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      POSTGRES_USER: driftlock_admin
      POSTGRES_DB: driftlock
      DB_HOST: db
      DB_PORT: 5432
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      MASTER_KEY: ${MASTER_KEY}
      SECRET_KEY: ${SECRET_KEY}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  internal-api:
    build: ./internal-api
    ports:
      - "0.0.0.0:5000:5000"   # INTENTIONAL — Vulnerability 3 (IDOR)
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      POSTGRES_USER: driftlock_admin
      POSTGRES_DB: driftlock
      DB_HOST: db
      DB_PORT: 5432
      LOGS_DIR: /app/logs
    restart: always
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  redis:
    image: redis:7
    container_name: driftlock-redis-1
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    

  mailpit:
    image: axllent/mailpit:latest
    container_name: blueteam-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "0.0.0.0:8025:8025"
    networks:
      - backend
      - frontend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logs:/logs:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "0.0.0.0:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  frontend:
  backend:
    internal: true

volumes:
  pgdata:
  esdata: