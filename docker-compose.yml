services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: driftlock_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: driftlock
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftlock_admin -d driftlock"]
      interval: 5s
      timeout: 5s
      retries: 5
  web:
    build: ./web
    ports:
      - "4325:4325"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      POSTGRES_USER: driftlock_admin
      POSTGRES_DB: driftlock
      DB_HOST: db
      DB_PORT: 5432
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      MASTER_KEY: ${MASTER_KEY}
      SECRET_KEY: ${SECRET_KEY}
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./logs:/app/logs
  internal-api:
    build: ./internal-api
    ports:
      - "5000:5000"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      POSTGRES_USER: driftlock_admin
      POSTGRES_DB: driftlock
      DB_HOST: db
      DB_PORT: 5432
      LOGS_DIR: /app/logs
    restart: always
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
  redis:
    image: redis:7
    container_name: driftlock-redis-1
    restart: always
    ports:
      - "6379:6379"

      
  mailhog:
    image: axllent/mailpit:latest
    container_name: blueteam-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logs:/logs:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
volumes:
  pgdata:
  esdata:
  
 