input {
  file {
    path => "/logs/access.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    type => "access"
  }
  file {
    path => "/logs/honeypot.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    type => "honeypot"
  }
}

filter {
  if [type] == "access" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:log_timestamp} \| %{LOGLEVEL:level} \| %{IPORHOST:source_ip} \| %{WORD:method} %{URIPATHPARAM:request_path}"
      }
    }
    date {
      match => ["log_timestamp", "yyyy-MM-dd HH:mm:ss,SSS"]
      target => "@timestamp"
    }
    if [request_path] =~ /^\/backup_secrets/ {
      mutate { add_field => { "alert" => "honeypot_hit" } }
    }
  }

  if [type] == "honeypot" {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  if [type] == "honeypot" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "driftlock-honeypot-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "driftlock-access-%{+YYYY.MM.dd}"
    }
  }
}